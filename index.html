    <meta property="og:type" content="website" />

    <!-- Structured data: WebSite sets the site name Google shows above the
         link; Person feeds the name/role/links Google associates with it. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://joshuastrauch.com.br/#website",
            "url": "https://joshuastrauch.com.br/",
            "name": "Joshua Strauch",
            "alternateName": "Joshua Strauch — Software Engineer",
            "inLanguage": ["en", "pt-BR", "ru"],
            "publisher": { "@id": "https://joshuastrauch.com.br/#person" }
          },
          {
            "@type": "Person",
            "@id": "https://joshuastrauch.com.br/#person",
            "name": "Joshua Strauch",
            "url": "https://joshuastrauch.com.br/",
            "image": "https://joshuastrauch.com.br/og.png",
            "jobTitle": "Full-stack Software Engineer",
            "worksFor": {
              "@type": "Organization",
              "name": "FIEB — Federação das Indústrias do Estado da Bahia"
            },
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Salvador",
              "addressRegion": "BA",
              "addressCountry": "BR"
            },
            "knowsAbout": ["PHP", "Python", "C#", ".NET", "SQL", "PostgreSQL", "Laravel", "TypeScript", "Docker", "Kubernetes", "DevOps"],
            "knowsLanguage": ["pt-BR", "en", "ru"],
            "sameAs": [
              "https://github.com/Joshuascbritto",
              "https://www.linkedin.com/in/joshuastrauch/"
            ]
          }
        ]
      }
    </script>
    <!-- Real files, not a data: URI: Google Search only shows a favicon it can
         crawl. PNG is a multiple of 48px as Google requires. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap"

    />
