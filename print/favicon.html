<head>
<meta charset="utf-8" />

  html, body { margin: 0; background: #0a0a0a; }
  .icon {
    width: 512px; height: 512px;
    display: flex; align-items: center; justify-content: center;
    font: 800 400px/1 'JetBrains Mono', monospace;
    color: #c8ff2d;
  }
</style>
</head>
<body><div class="icon">J</div></body>
</html>
