<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>og</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" />
<style>
  html, body { margin: 0; width: 1200px; height: 630px; background: #0a0a0a; overflow: hidden; }
  body {
    box-sizing: border-box;
    padding: 72px 80px;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    color: #ededed;
    display: flex;
    flex-direction: column;
    border-left: 16px solid #c8ff2d;
  }
  .kicker { color: #6a6a6a; font-size: 26px; letter-spacing: 0.04em; }
  h1 { font-size: 112px; font-weight: 800; letter-spacing: -0.04em; line-height: 0.95; margin: 28px 0 22px; }
  h1 span { color: #c8ff2d; }
  .role { color: #c8ff2d; font-size: 40px; font-weight: 700; }
  .stack { font-size: 30px; margin-top: 14px; }
  .meta { margin-top: auto; display: flex; justify-content: space-between; font-size: 26px; color: #6a6a6a; }
  .meta b { color: #ededed; font-weight: 400; }
</style>
</head>
<body>
  <div class="kicker">joshuastrauch.com.br</div>
  <h1>Joshua Strauch<span>_</span></h1>
  <div class="role">› Full-stack Software Engineer</div>
  <div class="stack">PHP · Python · C#/.NET · SQL · DevOps</div>
  <div class="meta"><span>Salvador, Brazil · <b>UTC-3</b></span><span><b>open to remote roles</b></span></div>
</body>
</html>
